<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Editor - Native Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen overflow-hidden select-none font-sans">

  <!-- Header Navigation -->
  <header class="h-14 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 shrink-0 z-20">
    <div class="flex items-center space-x-2">
      <div class="bg-indigo-600 p-2 rounded-lg"><i data-lucide="file-edit" class="w-5 h-5 text-white"></i></div>
      <span class="font-bold text-sm md:text-base">PDF Editor Pro</span>
    </div>

    <!-- Page Controls -->
    <div class="flex items-center space-x-2 text-xs bg-slate-900 py-1 px-3 rounded-lg border border-slate-700">
      <button id="btn-prev" class="p-1 hover:bg-slate-700 rounded"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
      <span>หน้า <span id="page-num" class="text-indigo-400 font-bold">1</span> / <span id="total-pages">1</span></span>
      <button id="btn-next" class="p-1 hover:bg-slate-700 rounded"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
      <div class="h-4 w-px bg-slate-700 mx-1"></div>
      <button id="btn-zoom-out" class="p-1 hover:bg-slate-700 rounded"><i data-lucide="zoom-out" class="w-4 h-4"></i></button>
      <span id="zoom-text" class="font-mono">100%</span>
      <button id="btn-zoom-in" class="p-1 hover:bg-slate-700 rounded"><i data-lucide="zoom-in" class="w-4 h-4"></i></button>
    </div>

    <div class="flex items-center space-x-2">
      <input type="file" id="file-input" accept="application/pdf" class="hidden" />
      <button id="btn-upload" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg border border-slate-600 flex items-center space-x-1">
        <i data-lucide="upload" class="w-4 h-4"></i>
        <span>เปิด PDF</span>
      </button>
      <button id="btn-export" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3.5 py-1.5 rounded-lg shadow-lg flex items-center space-x-1 font-medium">
        <i data-lucide="download" class="w-4 h-4"></i>
        <span>ดาวน์โหลด PDF</span>
      </button>
    </div>
  </header>

  <!-- Toolbar -->
  <nav class="bg-slate-800/90 border-b border-slate-700 px-4 py-2 flex items-center justify-between gap-2 z-10 text-xs">
    <div class="flex items-center space-x-1 bg-slate-900 p-1 rounded-lg border border-slate-700">
      <button id="tool-blackout" class="tool-btn p-1.5 rounded bg-indigo-600 text-white font-bold flex items-center space-x-1" title="ถมดำทึบ 100%">
        <i data-lucide="shield-alert" class="w-4 h-4 text-amber-400"></i><span>ถมดำทึบ</span>
      </button>
      <button id="tool-highlighter" class="tool-btn p-1.5 rounded hover:bg-slate-700 text-yellow-300" title="ไฮไลต์สีเหลือง"><i data-lucide="highlighter" class="w-4 h-4"></i><span>ไฮไลต์</span></button>
      <button id="tool-text" class="tool-btn p-1.5 rounded hover:bg-slate-700 text-sky-400" title="พิมพ์ข้อความ"><i data-lucide="type" class="w-4 h-4"></i><span>ข้อความ</span></button>
      <button id="tool-rect" class="tool-btn p-1.5 rounded hover:bg-slate-700" title="กรอบสี่เหลี่ยม"><i data-lucide="square" class="w-4 h-4"></i><span>กรอบ</span></button>
    </div>

    <button id="btn-clear" class="bg-rose-900/40 text-rose-300 hover:bg-rose-900/80 px-2.5 py-1 rounded flex items-center space-x-1">
      <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i><span>ล้างหน้านี้</span>
    </button>
  </nav>

  <!-- Canvas Workspace -->
  <main class="flex-1 overflow-auto bg-slate-950 flex items-center justify-center p-4 relative">
    <div id="canvas-wrapper" class="relative bg-white shadow-2xl">
      <!-- PDF Layer -->
      <canvas id="pdf-canvas" class="absolute top-0 left-0 block z-0"></canvas>
      <!-- Drawing Layer -->
      <canvas id="draw-canvas" class="relative block z-10 cursor-crosshair"></canvas>
    </div>
  </main>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null, fileName = "document.pdf";
    let pageNum = 1, totalPages = 1, currentScale = 1.25;
    let currentTool = 'blackout';
    const pageShapes = {}; // เก็บข้อมูลการวาดในแต่ละหน้า { pageNum: [shapes] }

    const pdfCanvas = document.getElementById('pdf-canvas');
    const drawCanvas = document.getElementById('draw-canvas');
    const pdfCtx = pdfCanvas.getContext('2d');
    const drawCtx = drawCanvas.getContext('2d');

    let isDrawing = false, startX = 0, startY = 0, currentShape = null;

    // การวาดภาพลงบน Draw Canvas
    function redrawShapes() {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      const shapes = pageShapes[pageNum] || [];
      
      shapes.forEach(shape => drawSingleShape(shape));
      if (currentShape) drawSingleShape(currentShape);
    }

    function drawSingleShape(shape) {
      drawCtx.save();
      if (shape.type === 'blackout') {
        drawCtx.fillStyle = '#000000';
        drawCtx.fillRect(shape.x, shape.y, shape.w, shape.h);
      } else if (shape.type === 'highlighter') {
        drawCtx.fillStyle = 'rgba(250, 204, 21, 0.4)';
        drawCtx.fillRect(shape.x, shape.y, shape.w, shape.h);
      } else if (shape.type === 'rect') {
        drawCtx.strokeStyle = '#f43f5e';
        drawCtx.lineWidth = 3;
        drawCtx.strokeRect(shape.x, shape.y, shape.w, shape.h);
      } else if (shape.type === 'text') {
        drawCtx.fillStyle = '#000000';
        drawCtx.fillRect(shape.x, shape.y - 18, drawCtx.measureText(shape.text).width + 10, 24);
        drawCtx.fillStyle = '#ffffff';
        drawCtx.font = '16px sans-serif';
        drawCtx.fillText(shape.text, shape.x + 5, shape.y);
      }
      drawCtx.restore();
    }

    // Event Mouse สำหรับวาดรูปทรง
    drawCanvas.addEventListener('mousedown', (e) => {
      const rect = drawCanvas.getBoundingClientRect();
      startX = e.clientX - rect.left;
      startY = e.clientY - rect.top;
      isDrawing = true;

      if (currentTool === 'text') {
        const text = prompt('ใส่ข้อความที่ต้องการพิมพ์:', 'CONFIDENTIAL');
        if (text) {
          if (!pageShapes[pageNum]) pageShapes[pageNum] = [];
          pageShapes[pageNum].push({ type: 'text', x: startX, y: startY, text });
          redrawShapes();
        }
        isDrawing = false;
      }
    });

    drawCanvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const rect = drawCanvas.getBoundingClientRect();
      const currentX = e.clientX - rect.left;
      const currentY = e.clientY - rect.top;

      const w = currentX - startX;
      const h = currentY - startY;

      currentShape = {
        type: currentTool,
        x: w < 0 ? currentX : startX,
        y: h < 0 ? currentY : startY,
        w: Math.abs(w),
        h: Math.abs(h)
      };
      redrawShapes();
    });

    drawCanvas.addEventListener('mouseup', () => {
      if (!isDrawing) return;
      isDrawing = false;
      if (currentShape) {
        if (!pageShapes[pageNum]) pageShapes[pageNum] = [];
        pageShapes[pageNum].push(currentShape);
        currentShape = null;
        redrawShapes();
      }
    });

    // เรนเดอร์หน้า PDF
    async function renderPage(num) {
      if (!pdfDoc) return;
      pageNum = num;
      document.getElementById('page-num').textContent = pageNum;

      const page = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale: currentScale });

      pdfCanvas.width = viewport.width;
      pdfCanvas.height = viewport.height;
      drawCanvas.width = viewport.width;
      drawCanvas.height = viewport.height;

      const wrapper = document.getElementById('canvas-wrapper');
      wrapper.style.width = viewport.width + 'px';
      wrapper.style.height = viewport.height + 'px';

      await page.render({ canvasContext: pdfCtx, viewport }).promise;
      redrawShapes();
    }

    async function loadPDF(arrayBuffer, name) {
      fileName = name || "document.pdf";
      pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer, ignoreEncryption: true }).promise;
      totalPages = pdfDoc.numPages;
      document.getElementById('total-pages').textContent = totalPages;
      await renderPage(1);
    }

    async function exportPDF() {
      if (!pdfDoc) return;

      const { PDFDocument } = PDFLib;
      const newPdf = await PDFDocument.create();

      for (let i = 1; i <= totalPages; i++) {
        const page = await pdfDoc.getPage(i);
        const viewport = page.getViewport({ scale: currentScale });

        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = viewport.width;
        exportCanvas.height = viewport.height;
        const eCtx = exportCanvas.getContext('2d');

        // 1. วาดหน้า PDF
        await page.render({ canvasContext: eCtx, viewport }).promise;

        // 2. วาดรอยถมดำ/รูปทรงทับลงไปโดยตรง
        const shapes = pageShapes[i] || [];
        shapes.forEach(shape => {
          eCtx.save();
          if (shape.type === 'blackout') {
            eCtx.fillStyle = '#000000';
            eCtx.fillRect(shape.x, shape.y, shape.w, shape.h);
          } else if (shape.type === 'highlighter') {
            eCtx.fillStyle = 'rgba(250, 204, 21, 0.4)';
            eCtx.fillRect(shape.x, shape.y, shape.w, shape.h);
          } else if (shape.type === 'rect') {
            eCtx.strokeStyle = '#f43f5e';
            eCtx.lineWidth = 3;
            eCtx.strokeRect(shape.x, shape.y, shape.w, shape.h);
          } else if (shape.type === 'text') {
            eCtx.fillStyle = '#000000';
            eCtx.fillRect(shape.x, shape.y - 18, eCtx.measureText(shape.text).width + 10, 24);
            eCtx.fillStyle = '#ffffff';
            eCtx.font = '16px sans-serif';
            eCtx.fillText(shape.text, shape.x + 5, shape.y);
          }
          eCtx.restore();
        });

        const pagePng = exportCanvas.toDataURL('image/png');
        const embeddedImg = await newPdf.embedPng(pagePng);
        const newPage = newPdf.addPage([viewport.width, viewport.height]);
        newPage.drawImage(embeddedImg, { x: 0, y: 0, width: viewport.width, height: viewport.height });
      }

      const pdfBytes = await newPdf.save();
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = fileName.replace(/\.pdf$/i, '') + '_edited.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Event Listeners
    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => loadPDF(reader.result, file.name);
        reader.readAsArrayBuffer(file);
      }
    });

    document.getElementById('btn-upload').onclick = () => document.getElementById('file-input').click();
    document.getElementById('btn-export').onclick = exportPDF;
    document.getElementById('btn-prev').onclick = () => { if (pageNum > 1) renderPage(pageNum - 1); };
    document.getElementById('btn-next').onclick = () => { if (pageNum < totalPages) renderPage(pageNum + 1); };

    document.getElementById('btn-zoom-in').onclick = () => {
      if (currentScale < 2.5) {
        currentScale += 0.25;
        document.getElementById('zoom-text').textContent = Math.round(currentScale * 100) + '%';
        renderPage(pageNum);
      }
    };

    document.getElementById('btn-zoom-out').onclick = () => {
      if (currentScale > 0.5) {
        currentScale -= 0.25;
        document.getElementById('zoom-text').textContent = Math.round(currentScale * 100) + '%';
        renderPage(pageNum);
      }
    };

    const tools = ['blackout', 'highlighter', 'text', 'rect'];
    tools.forEach(tool => {
      const btn = document.getElementById('tool-' + tool);
      if (btn) {
        btn.onclick = () => {
          currentTool = tool;
          tools.forEach(t => {
            const b = document.getElementById('tool-' + t);
            if (b) b.classList.remove('bg-indigo-600', 'text-white');
          });
          btn.classList.add('bg-indigo-600', 'text-white');
        };
      }
    });

    document.getElementById('btn-clear').onclick = () => {
      pageShapes[pageNum] = [];
      redrawShapes();
    };

    lucide.createIcons();
  </script>
</body>
</html>
