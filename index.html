<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Editor & Redaction Tool</title>
  <!-- Tailwind CSS สำหรับจัดแต่งหน้าจอ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js สำหรับอ่านและเรนเดอร์เอกสาร PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- PDF-Lib สำหรับประมวลผลและส่งออกไฟล์ PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <!-- Lucide Icons สำหรับไอคอนปุ่ม -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* ซ่อน scrollbar เกินจำเป็น */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
    .canvas-wrapper {
      position: relative;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      background-color: #ffffff;
      margin: auto;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden select-none font-sans">

  <!-- แถบด้านบนสุด (Top Navigation) -->
  <header class="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-3 md:px-5 shrink-0 z-20">
    <div class="flex items-center space-x-2.5">
      <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-md">
        <i data-lucide="file-edit" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm md:text-base leading-tight text-white">PDF Editor</h1>
        <p class="text-[11px] text-slate-400 hidden sm:block">ถมดำทึบ • ไฮไลต์ตรง • พิมพ์ข้อความ</p>
      </div>
    </div>

    <!-- ส่วนเปลี่ยนหน้าและซูม -->
    <div class="flex items-center space-x-1 sm:space-x-2 text-xs bg-slate-800/80 py-1 px-2 md:px-3 rounded-xl border border-slate-700">
      <button id="btn-prev-page" class="p-1 hover:bg-slate-700 rounded text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed transition" title="หน้าก่อนหน้า">
        <i data-lucide="chevron-left" class="w-4 h-4"></i>
      </button>
      <span class="font-medium px-1 whitespace-nowrap">
        หน้า <span id="current-page-num" class="text-indigo-400 font-bold">1</span> / <span id="total-pages">1</span>
      </span>
      <button id="btn-next-page" class="p-1 hover:bg-slate-700 rounded text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed transition" title="หน้าถัดไป">
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </button>
      <div class="h-4 w-px bg-slate-700 mx-1"></div>
      <button id="btn-zoom-out" class="p-1 hover:bg-slate-700 rounded text-slate-300 transition" title="ย่อ">
        <i data-lucide="zoom-out" class="w-4 h-4"></i>
      </button>
      <span id="zoom-level" class="text-xs font-mono w-10 text-center text-slate-300">100%</span>
      <button id="btn-zoom-in" class="p-1 hover:bg-slate-700 rounded text-slate-300 transition" title="ขยาย">
        <i data-lucide="zoom-in" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- ปุ่มเปิดและดาวน์โหลดไฟล์ -->
    <div class="flex items-center space-x-2">
      <input type="file" id="pdf-file-input" accept="application/pdf" class="hidden" />
      <button id="btn-upload" class="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 text-xs md:text-sm font-medium px-3 py-1.5 rounded-xl border border-slate-700 transition">
        <i data-lucide="upload" class="w-4 h-4 text-indigo-400"></i>
        <span>เปิดไฟล์ PDF</span>
      </button>
      <button id="btn-sample-pdf" class="hidden md:flex items-center space-x-1 bg-slate-800/80 hover:bg-slate-700 text-xs px-2.5 py-1.5 rounded-xl border border-slate-700 text-amber-300 transition" title="เปิดไฟล์ตัวอย่างทดสอบ">
        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
        <span>ตัวอย่าง</span>
      </button>
      <button id="btn-download" class="flex items-center space-x-1.5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs md:text-sm font-semibold px-3.5 py-1.5 rounded-xl shadow-lg shadow-indigo-600/30 transition">
        <i data-lucide="download" class="w-4 h-4"></i>
        <span>ดาวน์โหลด PDF</span>
      </button>
    </div>
  </header>

  <!-- แถบเครื่องมือ (Toolbar) -->
  <nav class="bg-slate-900/95 border-b border-slate-800 px-3 md:px-5 py-2 flex flex-wrap items-center justify-between gap-2 z-10 text-xs">
    <div class="flex items-center space-x-1 bg-slate-950/70 p-1 rounded-xl border border-slate-800">
      <!-- ปุ่มถมดำทึบ 100% -->
      <button id="tool-blackout" class="tool-btn bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-lg flex items-center space-x-1.5 transition">
        <i data-lucide="shield-alert" class="w-4 h-4 text-rose-300"></i>
        <span>ถมดำทึบ 100%</span>
      </button>

      <!-- ปุ่มไฮไลต์สี่เหลี่ยม -->
      <button id="tool-highlighter" class="tool-btn text-amber-300 hover:text-white px-2.5 py-1.5 rounded-lg flex items-center space-x-1.5 transition">
        <i data-lucide="highlighter" class="w-4 h-4"></i>
        <span>ไฮไลต์</span>
      </button>

      <!-- ปุ่มพิมพ์ข้อความ -->
      <button id="tool-text" class="tool-btn text-sky-300 hover:text-white px-2.5 py-1.5 rounded-lg flex items-center space-x-1.5 transition">
        <i data-lucide="type" class="w-4 h-4"></i>
        <span>พิมพ์ข้อความ</span>
      </button>

      <!-- รูปทรงกรอบสี่เหลี่ยม -->
      <button id="tool-rect" class="tool-btn text-slate-300 hover:text-white px-2.5 py-1.5 rounded-lg flex items-center space-x-1.5 transition">
        <i data-lucide="square" class="w-4 h-4"></i>
        <span class="hidden sm:inline">กรอบสี่เหลี่ยม</span>
      </button>
    </div>

    <!-- ส่วนเลือกสีและขนาด -->
    <div class="flex items-center space-x-3 bg-slate-950/70 p-1 rounded-xl border border-slate-800">
      <!-- สีไฮไลต์/กรอบ -->
      <div class="flex items-center space-x-1.5 px-1">
        <span class="text-slate-400">สี:</span>
        <input type="color" id="shape-color-picker" value="#facc15" class="w-6 h-6 rounded border border-slate-700 bg-transparent cursor-pointer" />
      </div>

      <div class="h-4 w-px bg-slate-800"></div>

      <!-- ข้อความที่พิมพ์ -->
      <div class="flex items-center space-x-1">
        <span class="text-slate-400">คำที่พิมพ์:</span>
        <input type="text" id="custom-text-input" value="CONFIDENTIAL" class="bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-xs text-white w-28 focus:outline-none focus:border-indigo-500" />
      </div>

      <div class="h-4 w-px bg-slate-800"></div>

      <!-- ล้างหน้านี้ -->
      <button id="btn-clear" class="bg-rose-950/50 hover:bg-rose-900 border border-rose-800/60 text-rose-300 px-2.5 py-1 rounded-lg flex items-center space-x-1 transition">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        <span>ล้างหน้านี้</span>
      </button>
    </div>
  </nav>

  <!-- พื้นที่หน้าจอแสดงเอกสาร (Workspace Canvas) -->
  <main class="flex-1 overflow-auto bg-slate-950 flex items-center justify-center p-4 relative">
    <div id="canvas-wrapper" class="canvas-wrapper">
      <!-- 1. ชั้นล่าง: เรนเดอร์หน้ากระดาษ PDF -->
      <canvas id="pdf-canvas" class="absolute top-0 left-0 block z-0"></canvas>
      <!-- 2. ชั้นบน: วาดรอยถมดำ ไฮไลต์ และตัวหนังสือทับลงไป -->
      <canvas id="draw-canvas" class="relative block z-10 cursor-crosshair"></canvas>
    </div>

    <!-- กล่องแจ้งเตือน (Toast Notification) -->
    <div id="toast-message" class="hidden fixed bottom-5 right-5 bg-slate-800 border border-slate-700 text-slate-100 text-xs md:text-sm px-4 py-2.5 rounded-xl shadow-2xl flex items-center space-x-2 z-50 transition-all">
      <i id="toast-icon" data-lucide="info" class="w-4 h-4 text-indigo-400"></i>
      <span id="toast-text">ข้อความ</span>
    </div>
  </main>

  <script>
    // กำหนด Worker สำหรับ PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ตัวแปรสถานะ
    let pdfDoc = null;
    let originalPdfBytes = null;
    let fileName = "document.pdf";
    let currentPageNum = 1;
    let totalPages = 1;
    let currentScale = 1.25;
    let currentTool = 'blackout'; // 'blackout', 'highlighter', 'text', 'rect'
    let currentColor = '#facc15';

    // เก็บรายการรูปทรงที่วาดในแต่ละหน้า: { pageNum: [shapes] }
    const pageShapes = {};

    const pdfCanvas = document.getElementById('pdf-canvas');
    const drawCanvas = document.getElementById('draw-canvas');
    const pdfCtx = pdfCanvas.getContext('2d');
    const drawCtx = drawCanvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvas-wrapper');

    let isDrawing = false;
    let startX = 0;
    let startY = 0;
    let previewShape = null;

    // แสดงแจ้งเตือน Toast
    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast-message');
      const text = document.getElementById('toast-text');
      const icon = document.getElementById('toast-icon');
      if (!toast || !text) return;

      text.textContent = msg;
      if (type === 'success') {
        icon.setAttribute('data-lucide', 'check-circle-2');
        icon.className = 'w-4 h-4 text-emerald-400';
      } else if (type === 'error') {
        icon.setAttribute('data-lucide', 'alert-circle');
        icon.className = 'w-4 h-4 text-rose-400';
      } else {
        icon.setAttribute('data-lucide', 'info');
        icon.className = 'w-4 h-4 text-indigo-400';
      }
      lucide.createIcons();

      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    // ฟังก์ชันวาดรูปทรงลงใน Draw Canvas
    function redrawShapes() {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      const shapes = pageShapes[currentPageNum] || [];

      shapes.forEach(shape => drawSingleShape(drawCtx, shape));
      if (previewShape) {
        drawSingleShape(drawCtx, previewShape);
      }
    }

    function drawSingleShape(ctx, shape) {
      ctx.save();
      if (shape.type === 'blackout') {
        // ถมดำทึบสนิท 100%
        ctx.fillStyle = '#000000';
        ctx.fillRect(shape.x, shape.y, shape.w, shape.h);
      } else if (shape.type === 'highlighter') {
        // ไฮไลต์ตรงโปร่งแสง
        ctx.fillStyle = shape.color || 'rgba(250, 204, 21, 0.4)';
        ctx.fillRect(shape.x, shape.y, shape.w, shape.h);
      } else if (shape.type === 'rect') {
        // กรอบสี่เหลี่ยม
        ctx.strokeStyle = shape.color || '#f43f5e';
        ctx.lineWidth = 3;
        ctx.strokeRect(shape.x, shape.y, shape.w, shape.h);
      } else if (shape.type === 'text') {
        // กล่องข้อความสีดำ ตัวหนังสือสีขาว
        ctx.font = 'bold 16px sans-serif';
        const textWidth = ctx.measureText(shape.text).width;
        const boxHeight = 26;
        const boxWidth = textWidth + 16;
        
        ctx.fillStyle = '#000000';
        ctx.fillRect(shape.x, shape.y - 20, boxWidth, boxHeight);
        
        ctx.fillStyle = '#ffffff';
        ctx.fillText(shape.text, shape.x + 8, shape.y - 2);
      }
      ctx.restore();
    }

    // จัดการเหตุการณ์การวาด (Mouse & Touch)
    function getPointerPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function handleStart(e) {
      const pos = getPointerPos(e);
      startX = pos.x;
      startY = pos.y;
      isDrawing = true;

      if (currentTool === 'text') {
        const textVal = document.getElementById('custom-text-input').value || 'CONFIDENTIAL';
        if (!pageShapes[currentPageNum]) pageShapes[currentPageNum] = [];
        pageShapes[currentPageNum].push({
          type: 'text',
          x: startX,
          y: startY,
          text: textVal
        });
        redrawShapes();
        isDrawing = false;
      }
    }

    function handleMove(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPointerPos(e);

      const w = pos.x - startX;
      const h = pos.y - startY;

      let hexColor = currentColor;
      let alphaColor = currentColor;
      // แปลงสีเป็นโปร่งแสงถ้าเป็นไฮไลต์
      if (currentTool === 'highlighter') {
        const r = parseInt(hexColor.slice(1, 3), 16) || 250;
        const g = parseInt(hexColor.slice(3, 5), 16) || 204;
        const b = parseInt(hexColor.slice(5, 7), 16) || 21;
        alphaColor = `rgba(${r}, ${g}, ${b}, 0.4)`;
      }

      previewShape = {
        type: currentTool,
        x: w < 0 ? pos.x : startX,
        y: h < 0 ? pos.y : startY,
        w: Math.abs(w),
        h: Math.abs(h),
        color: currentTool === 'highlighter' ? alphaColor : hexColor
      };
      redrawShapes();
    }

    function handleEnd() {
      if (!isDrawing) return;
      isDrawing = false;
      if (previewShape && previewShape.w > 3 && previewShape.h > 3) {
        if (!pageShapes[currentPageNum]) pageShapes[currentPageNum] = [];
        pageShapes[currentPageNum].push(previewShape);
      }
      previewShape = null;
      redrawShapes();
    }

    drawCanvas.addEventListener('mousedown', handleStart);
    drawCanvas.addEventListener('mousemove', handleMove);
    drawCanvas.addEventListener('mouseup', handleEnd);

    drawCanvas.addEventListener('touchstart', handleStart, { passive: false });
    drawCanvas.addEventListener('touchmove', handleMove, { passive: false });
    drawCanvas.addEventListener('touchend', handleEnd);

    // ฟังก์ชันเรนเดอร์หน้า PDF
    async function renderPage(num) {
      if (!pdfDoc) return;
      currentPageNum = num;
      document.getElementById('current-page-num').textContent = currentPageNum;
      document.getElementById('btn-prev-page').disabled = (currentPageNum <= 1);
      document.getElementById('btn-next-page').disabled = (currentPageNum >= totalPages);

      const page = await pdfDoc.getPage(currentPageNum);
      const viewport = page.getViewport({ scale: currentScale });

      // ตั้งขนาด Canvas ทั้งสองแผ่นให้ตรงกันเป๊ะ 100%
      pdfCanvas.width = viewport.width;
      pdfCanvas.height = viewport.height;
      drawCanvas.width = viewport.width;
      drawCanvas.height = viewport.height;

      canvasWrapper.style.width = viewport.width + 'px';
      canvasWrapper.style.height = viewport.height + 'px';

      // 1. เรนเดอร์เนื้อหาหน้า PDF ลงแผ่นล่าง
      await page.render({ canvasContext: pdfCtx, viewport }).promise;

      // 2. เรนเดอร์การถมดำ/ไฮไลต์ลงแผ่นบน
      redrawShapes();
    }

    // โหลดเอกสาร PDF เข้าสู่ระบบ
    async function loadPDF(arrayBuffer, name) {
      try {
        originalPdfBytes = arrayBuffer.slice(0);
        fileName = name || "document.pdf";

        // ปลดล็อก Encryption อัตโนมัติ ป้องกัน Error บนไฟล์ทางการ
        pdfDoc = await pdfjsLib.getDocument({
          data: arrayBuffer,
          ignoreEncryption: true
        }).promise;

        totalPages = pdfDoc.numPages;
        document.getElementById('total-pages').textContent = totalPages;
        
        // ล้างข้อมูลหน้าเดิม
        for (let k in pageShapes) delete pageShapes[k];

        await renderPage(1);
        showToast(`เปิดเอกสารสำเร็จ (${totalPages} หน้า)`, 'success');
      } catch (err) {
        console.error(err);
        showToast('เปิดไฟล์ PDF ไม่สำเร็จ: ' + err.message, 'error');
      }
    }

    // สร้างตัวอย่างทดสอบทันทีเมื่อเปิดเว็บ
    async function generateSamplePdf() {
      try {
        const { PDFDocument, rgb } = PDFLib;
        const doc = await PDFDocument.create();
        const page = doc.addPage([595, 842]); // ขนาด A4
        
        // วาดเนื้อหาตัวอย่าง
        page.drawText("PDF Highlighting & Blackout Test Document", {
          x: 50,
          y: 780,
          size: 18,
          color: rgb(0.1, 0.1, 0.3)
        });

        page.drawText("Test Line 1: Confidential Data (Try blacking out this line)", {
          x: 50,
          y: 730,
          size: 13,
          color: rgb(0.2, 0.2, 0.2)
        });

        page.drawText("Test Line 2: Important notes for review (Try highlighting this line)", {
          x: 50,
          y: 690,
          size: 13,
          color: rgb(0.2, 0.2, 0.2)
        });

        page.drawRectangle({
          x: 50,
          y: 580,
          width: 495,
          height: 80,
          borderColor: rgb(0.7, 0.7, 0.8),
          borderWidth: 1
        });

        page.drawText("Secret Code: 8941-4921-9921-0012", {
          x: 70,
          y: 620,
          size: 14,
          color: rgb(0.8, 0.2, 0.2)
        });

        const bytes = await doc.save();
        await loadPDF(bytes.buffer, "sample_document.pdf");
      } catch (e) {
        console.error(e);
      }
    }

    // ฟังก์ชันส่งออก PDF (Export Annotated PDF)
    async function exportPDF() {
      if (!pdfDoc) {
        showToast('กรุณาเปิดไฟล์ PDF ก่อนดาวน์โหลด', 'error');
        return;
      }

      showToast('กำลังประมวลผลและสร้างไฟล์ PDF...', 'info');

      try {
        const { PDFDocument } = PDFLib;
        const newDoc = await PDFDocument.create();

        for (let i = 1; i <= totalPages; i++) {
          const page = await pdfDoc.getPage(i);
          // ใช้สเกลเดียวกับที่แสดงบนหน้าจอ พิกัดจะตรง 100% ไม่เลื่อน
          const viewport = page.getViewport({ scale: currentScale });

          const exportCanvas = document.createElement('canvas');
          exportCanvas.width = viewport.width;
          exportCanvas.height = viewport.height;
          const eCtx = exportCanvas.getContext('2d');

          // 1. วาดหน้า PDF เดิม
          await page.render({ canvasContext: eCtx, viewport }).promise;

          // 2. วาดการถมดำและตัวหนังสือทับลงไปบนพิกเซลจริง
          const shapes = pageShapes[i] || [];
          shapes.forEach(shape => drawSingleShape(eCtx, shape));

          // 3. แปลงเป็นภาพและฝังลงในเอกสาร PDF ใหม่
          const pagePng = exportCanvas.toDataURL('image/png');
          const embeddedImg = await newDoc.embedPng(pagePng);
          const newPage = newDoc.addPage([viewport.width, viewport.height]);
          newPage.drawImage(embeddedImg, {
            x: 0,
            y: 0,
            width: viewport.width,
            height: viewport.height
          });
        }

        const pdfBytes = await newDoc.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);

        // คำสั่งดาวน์โหลดลงเครื่อง
        const a = document.createElement('a');
        a.href = url;
        const cleanName = fileName.replace(/\.pdf$/i, '');
        a.download = `${cleanName}_edited.pdf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        showToast('ดาวน์โหลดไฟล์ PDF เรียบร้อยแล้ว!', 'success');
      } catch (err) {
        console.error(err);
        showToast('บันทึกไฟล์ไม่สำเร็จ: ' + err.message, 'error');
      }
    }

    // ผูก Event Listeners ทั้งหมด
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      const fileInput = document.getElementById('pdf-file-input');
      document.getElementById('btn-upload').onclick = () => fileInput.click();

      fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file && file.type === 'application/pdf') {
          const reader = new FileReader();
          reader.onload = () => loadPDF(reader.result, file.name);
          reader.readAsArrayBuffer(file);
        }
      };

      document.getElementById('btn-sample-pdf').onclick = generateSamplePdf;
      document.getElementById('btn-download').onclick = exportPDF;

      // ปุ่มเปลี่ยนหน้า
      document.getElementById('btn-prev-page').onclick = () => {
        if (currentPageNum > 1) renderPage(currentPageNum - 1);
      };
      document.getElementById('btn-next-page').onclick = () => {
        if (currentPageNum < totalPages) renderPage(currentPageNum + 1);
      };

      // ปุ่มซูม
      document.getElementById('btn-zoom-in').onclick = () => {
        if (currentScale < 2.5) {
          currentScale += 0.25;
          document.getElementById('zoom-level').textContent = Math.round(currentScale * 100) + '%';
          renderPage(currentPageNum);
        }
      };

      document.getElementById('btn-zoom-out').onclick = () => {
        if (currentScale > 0.6) {
          currentScale -= 0.25;
          document.getElementById('zoom-level').textContent = Math.round(currentScale * 100) + '%';
          renderPage(currentPageNum);
        }
      };

      // สลับเครื่องมือ
      const toolMap = {
        'tool-blackout': 'blackout',
        'tool-highlighter': 'highlighter',
        'tool-text': 'text',
        'tool-rect': 'rect'
      };

      Object.entries(toolMap).forEach(([btnId, tool]) => {
        document.getElementById(btnId).onclick = () => {
          currentTool = tool;
          document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.classList.remove('bg-indigo-600', 'text-white');
          });
          document.getElementById(btnId).classList.add('bg-indigo-600', 'text-white');
        };
      });

      // เลือกสี
      document.getElementById('shape-color-picker').oninput = (e) => {
        currentColor = e.target.value;
      };

      // ล้างหน้านี้
      document.getElementById('btn-clear').onclick = () => {
        pageShapes[currentPageNum] = [];
        redrawShapes();
        showToast('ล้างการแก้ไขในหน้านี้แล้ว');
      };

      // โหลดตัวอย่างเริ่มต้นทันที
      generateSamplePdf();
    });
  </script>
</body>
</html>
